name: cgp-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: cgp-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cgp_demo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgp_demo_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cgp_demo_db}
    volumes:
      - cgp_demo_pgdata:/var/lib/postgresql/data
    networks:
      - back-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cgp_demo_user} -d ${POSTGRES_DB:-cgp_demo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: cgp-demo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: demo
      DEMO_MODE: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3457}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3457}
      DATABASE_URL: ${DATABASE_URL:-postgres://cgp_demo_user:cgp_demo_password_2026@postgres:5432/cgp_demo_db?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET bắt buộc phải có giá trị tối thiểu 32 ký tự trong chế độ Demo (INV-04)}
      JWT_ISSUER: cgp-demo
      COOKIE_NAME: cgp_demo_session
      MOCK_OAUTH_ENABLED: "false"
      AUTO_SEED: ${AUTO_SEED:-true}
      ZALO_CLIENT_ID: ${ZALO_CLIENT_ID:-}
      ZALO_CLIENT_SECRET: ${ZALO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cgp.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    networks:
      - front-demo
      - back-demo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: cgp-demo-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3457:80"
    networks:
      - front-demo

networks:
  front-demo:
    name: cgp-demo-front-net
  back-demo:
    name: cgp-demo-back-net
    internal: true

volumes:
  cgp_demo_pgdata:
    name: cgp-demo-pgdata
