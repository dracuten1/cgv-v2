name: cgp-v2

services:
  postgres:
    image: postgres:16-alpine
    container_name: cgp-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cgp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgp_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cgp_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cgp_user} -d ${POSTGRES_DB:-cgp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: cgp-v2-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: ${APP_ENV:-prod}
      DEMO_MODE: ${DEMO_MODE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3456}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3456,http://localhost:3457}
      DATABASE_URL: ${DATABASE_URL:-postgres://cgp_user:cgp_secure_password_2026@postgres:5432/cgp_db?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-super-secure-jwt-secret-key-32chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-}
      COOKIE_NAME: ${COOKIE_NAME:-}
      MOCK_OAUTH_ENABLED: ${MOCK_OAUTH_ENABLED:-false}
      AUTO_SEED: ${AUTO_SEED:-true}
      ZALO_CLIENT_ID: ${ZALO_CLIENT_ID:-}
      ZALO_CLIENT_SECRET: ${ZALO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@cgp.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    networks:
      - front-net
      - back-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: cgp-v2-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3456:80"
    networks:
      - front-net

networks:
  front-net:
    name: cgp-v2-front-net
  back-net:
    name: cgp-v2-back-net
    internal: true

volumes:
  pgdata:
    name: cgp-v2-pgdata
