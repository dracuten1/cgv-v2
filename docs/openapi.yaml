      responses:
        '201':
          description: Điểm liên hệ được thêm thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPoint'
        '400':
          description: Dữ liệu điểm liên hệ không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Điểm liên hệ này đã được đăng ký bởi người dùng khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/contacts/{id}/verify:
    post:
      tags:
        - Auth
      summary: Kích hoạt gửi mã hoặc liên kết xác thực điểm liên hệ
      operationId: triggerVerifyContact
      security:
        - bearerAuth: []
        - cookieAuth: []
        - demoCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ContactIdParam'
      responses:
        '200':
          description: Đã gửi liên kết xác thực hoặc điểm liên hệ đã xác thực trước đó
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đã gửi liên kết xác thực đến email của bạn
        '400':
          description: Loại liên hệ không hỗ trợ gửi xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy điểm liên hệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /push/subscribe:
    post:
      tags:
        - Push
      summary: Đăng ký nhận thông báo Web Push (VAPID) cho người dùng
      operationId: subscribePush
      security:
        - bearerAuth: []
        - cookieAuth: []
        - demoCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - p256dh
                - auth
              properties:
                endpoint:
                  type: string
                  example: https://fcm.googleapis.com/fcm/send/...
                p256dh:
                  type: string
                  example: BEl62iUYgUivxIkv69yViEuiBIa...
                auth:
                  type: string
                  example: 5KZyA3q8LhXq...
      responses:
        '200':
          description: Đăng ký nhận thông báo Web Push thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đăng ký nhận thông báo thành công
        '400':
          description: Thông tin đăng ký không đầy đủ hoặc khóa mã hóa không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Yêu cầu đăng nhập để đăng ký nhận thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Push
      summary: Hủy đăng ký nhận thông báo Web Push theo endpoint
      operationId: unsubscribePush
      security:
        - bearerAuth: []
        - cookieAuth: []
        - demoCookieAuth: []
      parameters:
        - name: endpoint
          in: query
          required: false
          description: Địa chỉ endpoint cần hủy đăng ký (có thể truyền qua query hoặc JSON body)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Hủy đăng ký nhận thông báo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hủy đăng ký nhận thông báo thành công
        '400':
          description: Thiếu thông tin địa chỉ endpoint cần hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Yêu cầu đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy thông tin đăng ký nhận thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
