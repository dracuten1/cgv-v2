                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderInfo'

  /auth/{provider}/login:
    get:
      tags:
        - Auth
      summary: Khởi tạo luồng đăng nhập OAuth 2.0 / PKCE (Chuyển hướng 302)
      operationId: startOAuthLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
      responses:
        '302':
          description: Chuyển hướng trình duyệt đến trang đăng nhập của nhà cung cấp OAuth
          headers:
            Location:
              schema:
                type: string
                description: URL đăng nhập OAuth từ nhà cung cấp
        '404':
          description: Nhà cung cấp không hỗ trợ hoặc bị vô hiệu hóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/{provider}/callback:
    get:
      tags:
        - Auth
      summary: Xử lý phản hồi ủy quyền (Callback) từ nhà cung cấp OAuth
      description: >-
        Xử lý phản hồi ủy quyền OAuth 2.0 / PKCE từ nhà cung cấp xác thực. Hỗ trợ thỏa thuận nội dung (Content negotiation) theo hai chế độ từ HEAD bf81f52:
        (1) Trình duyệt (Browser mode - tiêu đề `Accept` chứa `text/html`): Chuyển hướng 302 về ứng dụng web SPA tại `{PUBLIC_BASE_URL}/auth/oauth/callback`.
        Khi thành công, thiết lập Cookie phiên `cgp_session` (hoặc `cgp_demo_session`) và chuyển hướng kèm tham số `?oauth_linked={provider}`.
        Khi thất bại, chuyển hướng kèm mã lỗi an toàn `?oauth_error={invalid_state|already_linked|provider_error|demo_restricted|server_error}` (Location được xây dựng nghiêm ngặt từ `PUBLIC_BASE_URL` ngăn chặn triệt để Open Redirect).
        (2) API / JSON mode (yêu cầu XHR/Fetch không mang `text/html`): Trả về phản hồi JSON tiêu chuẩn với mã 200 (kèm Set-Cookie phiên) hoặc mã lỗi (400 VALIDATION_ERROR, 403 DEMO_ISOLATION_VIOLATION, 409 CONFLICT, 502 PROVIDER_EXCHANGE_FAILED).
      operationId: handleOAuthCallback
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
        - name: code
          in: query
          required: true
          description: Mã ủy quyền tạm thời (Authorization Code)
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Mã trạng thái phòng chống tấn công CSRF (State token)
          schema:
            type: string
      responses:
        '200':
          description: Xác thực hoặc liên kết tài khoản thành công (Chế độ JSON / API)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: cgp_session=eyJhbGci...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
        '302':
          description: >-
            Chuyển hướng trình duyệt (Chế độ Browser - Accept: text/html) về SPA tại {PUBLIC_BASE_URL}/auth/oauth/callback.
            Thành công: ?oauth_linked={provider} đồng thời đính kèm Set-Cookie phiên.
            Thất bại: ?oauth_error={invalid_state|already_linked|provider_error|demo_restricted|server_error}.
          headers:
            Location:
              schema:
                type: string
                example: http://localhost:3456/auth/oauth/callback?oauth_linked=google
              description: URL đích của SPA, xây dựng nghiêm ngặt từ PUBLIC_BASE_URL
            Set-Cookie:
              schema:
                type: string
                example: cgp_session=eyJhbGci...; Path=/; HttpOnly; SameSite=Lax
              description: Thiết lập cookie phiên khi đăng nhập thành công
        '400':
          description: Mã xác thực hoặc tham số state không hợp lệ (Chế độ JSON - VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Vi phạm cách ly phiên dùng thử demo (Chế độ JSON - DEMO_ISOLATION_VIOLATION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Định danh đã được liên kết với tài khoản khác (Chế độ JSON - CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Lỗi kết nối hoặc trao đổi mã xác thực với nhà cung cấp OAuth (Chế độ JSON - PROVIDER_EXCHANGE_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

