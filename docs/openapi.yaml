            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Dữ liệu thành viên không hợp lệ hoặc sai định dạng giới tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Yêu cầu đăng nhập để tạo thành viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

