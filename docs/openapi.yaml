    post:
      tags:
        - Member
      summary: Thêm thành viên mới vào cây gia phả
      operationId: createMember
      security:
        - bearerAuth: []
        - cookieAuth: []
        - demoCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - family_id
                - full_name
                - gender
              properties:
                family_id:
                  type: string
                  format: uuid
                  example: d4e5f6a7-b8c9-0123-defa-234567890123
                full_name:
                  type: string
                  example: Nguyễn Văn Bình
                gender:
                  type: string
                  description: Giới tính thành viên (chấp nhận 'male'/'female' hoặc 'nam'/'nữ' theo INV-03)
                  enum: [male, female, nam, nữ, Nam, Nữ]
                  example: male
                generation_index:
                  type: integer
                  description: Bậc thế hệ trong dòng họ (mặc định 1)
                  example: 2
                birth_date:
                  type: string
                  format: date
                  nullable: true
                  example: "1975-06-15"
                death_date:
                  type: string
                  format: date
                  nullable: true
                  example: null
                is_living:
                  type: boolean
                  nullable: true
                  example: true
                avatar_url:
                  type: string
                  nullable: true
                  example: "https://example.com/avatar.jpg"
                notes:
                  type: string
                  nullable: true
                  example: Chi thứ hai
                parent_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách mã thành viên cha/mẹ
                  example: ["e5f6a7b8-c9d0-1234-efab-345678901234"]
                spouse_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách mã thành viên phối ngẫu (vợ/chồng)
                  example: []
      responses:
        '201':
          description: Thành viên mới được tạo thành công
