  /me/link/{provider}/callback:
    get:
      tags:
        - Auth
      summary: Xử lý chuyển hướng callback khi liên kết tài khoản (Public callback alias)
      description: >-
        Endpoint callback công khai khi liên kết thêm tài khoản mạng xã hội (Public callback alias không yêu cầu cookie phiên ban đầu vì chuyển hướng từ IdP bên thứ ba).
        Hỗ trợ Content negotiation từ HEAD bf81f52:
        (1) Trình duyệt (Browser mode - Accept: text/html): Chuyển hướng 302 về `{PUBLIC_BASE_URL}/auth/oauth/callback` kèm `?oauth_linked={provider}` và Set-Cookie phiên khi thành công;
        hoặc `?oauth_error={invalid_state|already_linked|provider_error|demo_restricted|server_error}` khi thất bại (đặc biệt mã 409 ánh xạ sang `already_linked`).
        (2) API / JSON mode: Trả về JSON envelope 200 thành công hoặc các mã lỗi 400 (VALIDATION_ERROR), 409 (CONFLICT: ErrAlreadyLinked), 502 (PROVIDER_EXCHANGE_FAILED).
      operationId: linkProviderCallback
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderParam'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liên kết định danh mới vào tài khoản thành công (Chế độ JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
        '302':
          description: >-
            Chuyển hướng trình duyệt (Chế độ Browser - Accept: text/html) về SPA tại {PUBLIC_BASE_URL}/auth/oauth/callback.
            Thành công: ?oauth_linked={provider} đồng thời đính kèm Set-Cookie phiên.
            Thất bại: ?oauth_error={invalid_state|already_linked|provider_error|demo_restricted|server_error}.
          headers:
            Location:
              schema:
                type: string
                example: http://localhost:3456/auth/oauth/callback?oauth_linked=google
              description: URL đích của SPA, xây dựng nghiêm ngặt từ PUBLIC_BASE_URL
            Set-Cookie:
              schema:
                type: string
                example: cgp_session=eyJhbGci...; Path=/; HttpOnly; SameSite=Lax
              description: Cập nhật cookie phiên sau khi liên kết tài khoản
        '400':
          description: Tham số ủy quyền không hợp lệ hoặc state cookie không khớp (Chế độ JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Định danh xã hội này đã được liên kết với một tài khoản khác (Chế độ JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Lỗi trao đổi mã xác thực với nhà cung cấp OAuth (Chế độ JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

