          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Số lượng thành viên trên mỗi trang
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách thành viên kèm thông tin tổng số lượng
          content:
