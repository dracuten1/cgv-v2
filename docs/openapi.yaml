openapi: 3.1.0
info:
  title: CGP v2
  version: 2.0.0
  description: >-
    Hệ thống Cây Gia Phả (CGP v2) — Ứng dụng quản lý gia phả và kết nối dòng họ ưu tiên văn hóa Việt Nam (Vietnamese-first genealogy platform).
    Kiến trúc tách biệt (split stack) với Backend REST API viết bằng Go (Gin Framework, PostgreSQL, Docker Compose) và Frontend Single Page Application (SPA) viết bằng Vue 3 (Pinia, TypeScript, Tailwind CSS, Vite, PWA).
    Hệ thống triển khai đầy đủ 9 nhóm tính năng cốt lõi (F1–F9):
    F1: Multi-provider auth & account linking (Zalo, Google, Facebook OAuth 2.0 + PKCE, Email Magic Link, Dùng thử Mode A Demo isolation, liên kết đa định danh vào một tài khoản);
    F2: Family tree visualization (Trực quan hóa đồ thị phả hệ phân tầng theo đời, thế hệ cội nguồn, quan hệ phụ mẫu và hôn phối);
    F3: Member CRUD & profile (Quản lý hồ sơ thành viên, quan hệ 1-hop, an toàn chống mồ côi orphan-safe, hỗ trợ đa dạng định dạng giới tính);
    F4: Vietnamese kinship calculator (Thuật toán xưng hô họ hàng tiếng Việt theo đồ thị phả hệ, phân biệt Chi nội / Chi ngoại / Hôn phối / Đồng tông, hỗ trợ 3 phương ngữ Bắc - Trung - Nam);
    F5: Excel import/export (Nhập và xuất toàn bộ dữ liệu phả hệ ra bảng tính Microsoft Excel .xlsx với cơ chế phát hiện trùng lặp và ghi nhận lỗi);
    F6: Family feed (Bảng tin hoạt động dòng họ, chia sẻ bài viết, thông báo lễ giỗ, đính kèm hình ảnh và phân trang theo con trỏ cursor);
    F7: PWA & push notifications (Ứng dụng web tiến bộ Progressive Web App và thông báo Web Push chuẩn VAPID không phụ thuộc dịch vụ trả phí);
    F8: Demo fixture & seed (Môi trường dùng thử tách biệt hoàn toàn với dữ liệu mẫu dòng họ mẫu mực, cookie riêng biệt cgp_demo_session);
    F9: Vietnamese design system (Hệ thống thiết kế thuần Việt, văn phong chuẩn mực có dấu tiếng Việt, định dạng ngày tháng và tôn trọng văn hóa gia đình truyền thống).
servers:
  - url: http://localhost:3456/api/v1
    description: Nginx Reverse Proxy (Khuyên dùng trong môi trường phát triển & sản xuất)
  - url: http://localhost:8080/api/v1
    description: Truy cập trực tiếp Go API Server (Cổng 8080)
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Kiểm tra tình trạng hoạt động và kết nối cơ sở dữ liệu
  - name: Auth
    description: Xác thực người dùng, phiên đăng nhập và định danh xã hội
  - name: Family
    description: Quản lý dòng họ, cây gia phả và xuất tệp
  - name: Member
    description: Quản lý thông tin thành viên, quan hệ huyết thống và hôn phối
  - name: Kinship
    description: Thuật toán tính toán quan hệ họ hàng và xưng hô tiếng Việt
  - name: Excel
    description: Nhập và xuất dữ liệu gia phả định dạng bảng tính Excel
  - name: Feed
    description: Bảng tin hoạt động và bài đăng dòng họ
  - name: Push
    description: Đăng ký và quản lý thông báo Web Push VAPID
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JSON Web Token (JWT) được cấp sau khi xác thực thành công (golang-jwt v5), truyền qua tiêu đề Authorization dạng 'Bearer <token>' hoặc đọc từ Cookie httpOnly session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cgp_session
      description: Cookie phiên đăng nhập chính thức (httpOnly, SameSite=Lax, Secure khi môi trường production). Cookie này cũng được thiết lập tự động trong phản hồi chuyển hướng trình duyệt (302) của luồng OAuth callback.
    demoCookieAuth:
      type: apiKey
      in: cookie
      name: cgp_demo_session
      description: Cookie phiên đăng nhập dùng thử cách ly (Mode A Demo Isolation - config.DemoCookieName). Hoạt động độc lập, không cho phép liên kết tài khoản và được cách ly nghiêm ngặt khỏi môi trường production.

  parameters:
    FamilyIdParam:
      name: id
      in: path
      required: true
      description: Mã định danh UUID của dòng họ
      schema:
        type: string
        format: uuid
    MemberIdParam:
      name: id
      in: path
      required: true
      description: Mã định danh UUID của thành viên gia phả
      schema:
        type: string
        format: uuid
    ProviderParam:
      name: provider
      in: path
      required: true
      description: Tên nhà cung cấp xác thực xã hội
      schema:
        type: string
        enum: [zalo, google, facebook, mock]
    ContactIdParam:
      name: id
      in: path
      required: true
      description: Mã định danh UUID của điểm liên hệ
      schema:
        type: string
        format: uuid
    IdentityIdParam:
      name: id
      in: path
      required: true
      description: Mã định danh UUID của định danh liên kết
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: Mã lỗi định danh hệ thống
          example: NOT_FOUND
        message:
          type: string
          description: Thông báo chi tiết bằng tiếng Việt có dấu (INV-02)
          example: Không tìm thấy dữ liệu yêu cầu
    Gender:
      type: string
      description: Giới tính chuẩn của thành viên (INV-03).
      enum:
        - male
        - female
      example: male
    User:
      type: object
      required:
        - id
        - display_name
        - is_demo
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        display_name:
          type: string
          example: Nguyễn Văn An
        is_demo:
          type: boolean
          example: false
        member_id:
          type: [string, "null"]
          format: uuid
          description: Mã định danh thành viên liên kết 1-1 trong cây gia phả
          example: 98765432-abcd-ef01-2345-6789abcdef01
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T08:00:00Z"
    Identity:
      type: object
      required:
        - id
        - user_id
        - provider
        - provider_subject
        - linked_at
        - last_login_at
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        user_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [zalo, google, facebook, email, demo, mock]
          example: google
        provider_subject:
          type: string
          example: "109876543210987654321"
        linked_at:
          type: string
          format: date-time
          example: "2026-09-21T08:30:00Z"
        last_login_at:
          type: string
          format: date-time
          example: "2026-09-21T09:00:00Z"
    ContactPoint:
      type: object
      required:
        - id
        - user_id
        - kind
        - value
        - verified
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [email, phone]
          example: email
        value:
          type: string
          example: an.nguyen@example.com
        verified:
          type: boolean
          example: true
        verified_via:
          type: [string, "null"]
          example: google
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T08:30:00Z"
    UserProfile:
      type: object
      required:
        - user
        - identities
        - contacts
      properties:
        user:
          $ref: '#/components/schemas/User'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
    ProviderInfo:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          enum: [zalo, google, facebook, email, demo, mock]
          example: zalo
        name:
          type: string
          example: Zalo
    AuthCallbackResponse:
      type: object
      properties:
        message:
          type: string
          example: Liên kết phương thức đăng nhập thành công
        user:
          $ref: '#/components/schemas/User'
        is_new:
          type: boolean
          example: false
        conflict_detected:
          type: boolean
          example: false
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    Family:
      type: object
      required:
        - id
        - name
        - version
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: d4e5f6a7-b8c9-0123-defa-234567890123
        name:
          type: string
          example: Dòng họ Nguyễn Văn
        version:
          type: integer
          format: int64
          description: Bộ đếm phiên bản phục vụ vô hiệu hóa bộ nhớ đệm phả hệ (ADR-009)
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T07:00:00Z"
    TreeNode:
      type: object
      required:
        - id
        - full_name
        - gender
        - generation_index
        - is_living
      properties:
        id:
          type: string
          format: uuid
          example: e5f6a7b8-c9d0-1234-efab-345678901234
        full_name:
          type: string
          example: Nguyễn Văn An
        gender:
          $ref: '#/components/schemas/Gender'
        generation_index:
          type: integer
          example: 1
        birth_date:
          type: [string, "null"]
          format: date
          example: "1950-01-01"
        death_date:
          type: [string, "null"]
          format: date
          example: null
        is_living:
          type: boolean
          example: true
        avatar_url:
          type: string
          example: ""
        spouse_ids:
          type: array
          items:
            type: string
            format: uuid
          example: []
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
    GenerationMeta:
      type: object
      required:
        - index
        - label
        - count
      properties:
        index:
          type: integer
          example: 1
        label:
          type: string
          example: Đời thứ 1
        count:
          type: integer
          example: 4
    FamilyTree:
      type: object
      required:
        - family_id
        - version
        - generations
        - roots
      properties:
        family_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          example: 1
        generations:
          type: array
          items:
            $ref: '#/components/schemas/GenerationMeta'
        roots:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
    Member:
      type: object
      required:
        - id
        - family_id
        - full_name
        - gender
        - generation_index
        - is_living
        - created_at
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Nguyễn Văn An
        gender:
          $ref: '#/components/schemas/Gender'
        generation_index:
          type: integer
          example: 1
        birth_date:
          type: [string, "null"]
          format: date-time
          example: "1950-01-01T00:00:00Z"
        death_date:
          type: [string, "null"]
          format: date-time
          example: null
        is_living:
          type: boolean
          example: true
        avatar_url:
          type: [string, "null"]
          example: "https://example.com/avatar.jpg"
        notes:
          type: [string, "null"]
          example: Trưởng tộc đời thứ nhất
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T07:15:00Z"
    MemberRelations:
      type: object
      required:
        - parents
        - children
        - siblings
        - spouses
      properties:
        parents:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        siblings:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        spouses:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    MemberDetail:
      type: object
      required:
        - id
        - family_id
        - full_name
        - gender
        - generation_index
        - is_living
        - created_at
        - family_name
        - relations
        - posts
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Nguyễn Văn An
        gender:
          $ref: '#/components/schemas/Gender'
        generation_index:
          type: integer
          example: 1
        birth_date:
          type: [string, "null"]
          format: date-time
        death_date:
          type: [string, "null"]
          format: date-time
        is_living:
          type: boolean
          example: true
        avatar_url:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        family_name:
          type: string
          example: Dòng họ Nguyễn Văn
        relations:
          $ref: '#/components/schemas/MemberRelations'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
    MemberPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          format: int64
          example: 53
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    KinshipResult:
      type: object
      required:
        - term
        - line
        - generation_distance
        - distance_label
        - is_blood
        - dialect
        - path
      properties:
        term:
          type: string
          description: >-
            Từ xưng hô thuần khiết không kèm dấu ngoặc kép (INV-05 rendering contract: Term is BARE text, UI components render plain text interpolation).
            Ví dụ: "Ông nội", "Bà nội", "Ông ngoại", "Bà ngoại", "Bố", "Mẹ", "Bác", "Chú", "Cô", "Cậu", "Dì", "Anh", "Chị", "Em", "Con trai", "Con gái", "Cháu nội", "Cháu ngoại", "Chắt", "Chút", "Chồng", "Vợ", "Bác dâu", "Thím", "Mợ", "Anh rể", "Chị dâu", "Em rể", "Em dâu", "Con rể", "Con dâu", "Bản thân".
            Phương ngữ Nam: "Nội", "Ngoại", "Chú út", "Cô út", "Cậu út", "Dì út", "Ba", "Má".
            Phương ngữ Trung: "O", "Ba", "Mạ".
          example: Ông nội
        line:
          type: string
          enum: [Chi nội, Chi ngoại, Hôn phối, Đồng tông]
          description: Nhánh quan hệ gia tộc (Chi nội - Patrilineal, Chi ngoại - Matrilineal, Hôn phối - Affinal, Đồng tông - Same-generation/Direct)
          example: Chi nội
        generation_distance:
          type: integer
          description: Chênh lệch thế hệ giữa người gốc và đích (dấu âm nếu đích là thế hệ sau, dấu dương nếu đích là thế hệ trước)
          example: 2
        distance_label:
          type: string
          description: Mô tả khoảng cách thế hệ bằng tiếng Việt (ví dụ "Cách 2 đời", "Cách 1 đời", "Cùng thế hệ")
          example: Cách 2 đời
        is_blood:
          type: boolean
          description: Đúng nếu quan hệ qua đường huyết thống (LCA path), sai nếu qua hôn phối (Dijkstra path)
          example: true
        dialect:
          type: string
          enum: [bac, trung, nam]
          description: Phương ngữ từ điển xưng hô được áp dụng
          example: bac
        path:
          type: array
          items:
            type: string
            format: uuid
          description: Chuỗi danh sách ID thành viên kết nối từ nguồn đến đích
          example: ["e5f6a7b8-c9d0-1234-efab-345678901234", "f6a7b8c9-d0e1-2345-fabc-456789012345"]
    Post:
      type: object
      required:
        - id
        - family_id
        - content
        - images
        - created_at
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        author_member_id:
          type: [string, "null"]
          format: uuid
          example: e5f6a7b8-c9d0-1234-efab-345678901234
        content:
          type: string
          example: Thông báo lễ giỗ tổ dòng họ năm 2026.
        images:
          type: array
          items:
            type: string
          example: ["https://example.com/photo1.jpg"]
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T09:30:00Z"
    PostItem:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          required:
            - author_display_name
          properties:
            author_display_name:
              type: string
              example: Nguyễn Văn An
    FeedCursor:
      type: object
      required:
        - created_at
        - id
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
    FeedListResponse:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostItem'
        next_cursor:
          anyOf:
            - $ref: '#/components/schemas/FeedCursor'
            - type: "null"
    ImportSummary:
      type: object
      required:
        - created
        - skipped_duplicates
        - errors
      properties:
        created:
          type: integer
          description: Số lượng bản ghi thành viên mới được thêm vào
          example: 50
        skipped_duplicates:
          type: integer
          description: Số bản ghi bị bỏ qua do trùng lặp (họ tên, ngày sinh)
          example: 2
        errors:
          type: array
          items:
            type: string
          description: Danh sách các lỗi cú pháp hoặc định dạng phát sinh trong quá trình nhập
          example: []
    PushSubscription:
      type: object
      required:
        - id
        - user_id
        - endpoint
        - p256dh
        - auth
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        endpoint:
          type: string
          example: https://updates.push.services.mozilla.com/wpush/v2/...
        p256dh:
          type: string
          example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM=
        auth:
          type: string
          example: tBHItJI5svbpez7KI4CCXg==
        created_at:
          type: string
          format: date-time
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Kiểm tra tình trạng hoạt động tổng thể (Root health check alias)
      operationId: checkHealthRoot
      security: []
      responses:
        '200':
          description: Hệ thống và cơ sở dữ liệu hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: up
                  version:
                    type: string
                    example: 2.0.0
                  time:
                    type: string
                    format: date-time
        '503':
          description: Cơ sở dữ liệu hoặc thành phần dịch vụ gặp sự cố
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags:
        - Health
      summary: Kiểm tra tình trạng hoạt động và kết nối DB (/api/v1/health)
      operationId: checkHealthV1
      security: []
      responses:
        '200':
          description: Dịch vụ sẵn sàng xử lý yêu cầu
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: up
                  version:
                    type: string
                    example: 2.0.0
                  time:
                    type: string
                    format: date-time
        '503':
          description: Sự cố kết nối cơ sở dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/providers:
    get:
      tags:
        - Auth
      summary: Lấy danh sách các nhà cung cấp xác thực đang được kích hoạt
      operationId: getAuthProviders
      security: []
      responses:
        '200':
          description: Danh sách nhà cung cấp khả dụng
          content:
