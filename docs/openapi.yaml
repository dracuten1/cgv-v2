      summary: Tính toán quan hệ xưng hô họ hàng tiếng Việt theo đồ thị phả hệ
      description: >-
        Thuật toán xưng hô họ hàng tiếng Việt chuẩn xác (INV-05 / F4) dựa trên đồ thị phả hệ (LCA - Lowest Common Ancestor cho quan hệ huyết thống và thuật toán Dijkstra có trọng số cho quan hệ hôn phối).
        Hỗ trợ 3 phương ngữ chuẩn: Bắc (bac - mặc định), Trung (trung), Nam (nam).
        Phân loại chính xác các nhánh dòng họ:
        - "Chi nội" (Patrilineal): Nhánh đằng nội qua chuỗi phụ mẫu nam giới (ví dụ: "Ông nội", "Bà nội", "Bác", "Chú", "Cô", "Cháu nội").
        - "Chi ngoại" (Matrilineal): Nhánh đằng ngoại qua chuỗi phụ mẫu nữ giới (ví dụ: "Ông ngoại", "Bà ngoại", "Cậu", "Dì", "Cháu ngoại").
        - "Hôn phối" (Affinal): Quan hệ vợ chồng hoặc thông gia/dâu rể (ví dụ: "Chồng", "Vợ", "Bác dâu", "Thím", "Mợ", "Anh rể", "Chị dâu", "Em rể", "Em dâu", "Con rể", "Con dâu").
        - "Đồng tông" (Same-generation/Direct): Cùng thế hệ hoặc bản thân ("Bản thân", "Anh", "Chị", "Em").
      operationId: calculateKinship
      security: []
      parameters:
        - name: from
          in: query
          required: true
          description: Mã định danh UUID của thành viên gốc (nguồn)
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          description: Mã định danh UUID của thành viên đích (cần xưng hô)
          schema:
            type: string
            format: uuid
        - name: dialect
          in: query
          required: false
          description: Phương ngữ từ điển xưng hô ('bac', 'trung', 'nam')
          schema:
            type: string
            enum: [bac, trung, nam]
            default: bac
      responses:
        '200':
          description: Kết quả thuật toán xưng hô với danh xưng thuần khiết (INV-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KinshipResult'
              examples:
                ong_noi_bac:
                  summary: Paternal grandfather (Ông nội - Chi nội, phương ngữ Bắc)
                  value:
                    term: "Ông nội"
                    line: "Chi nội"
                    generation_distance: 2
                    distance_label: "Cách 2 đời"
                    is_blood: true
                    dialect: "bac"
                    path:
                      - "e5f6a7b8-c9d0-1234-efab-345678901234"
                      - "d4e5f6a7-b8c9-0123-defa-234567890123"
                      - "c3d4e5f6-a7b8-9012-cdef-123456789012"
                ba_noi_bac:
                  summary: Paternal grandmother (Bà nội - Chi nội, phương ngữ Bắc)
                  value:
                    term: "Bà nội"
                    line: "Chi nội"
                    generation_distance: 2
                    distance_label: "Cách 2 đời"
                    is_blood: true
                    dialect: "bac"
                    path:
                      - "e5f6a7b8-c9d0-1234-efab-345678901234"
                      - "d4e5f6a7-b8c9-0123-defa-234567890123"
                      - "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                ong_ngoai_bac:
                  summary: Maternal grandfather (Ông ngoại - Chi ngoại, phương ngữ Bắc)
                  value:
                    term: "Ông ngoại"
                    line: "Chi ngoại"
                    generation_distance: 2
                    distance_label: "Cách 2 đời"
                    is_blood: true
                    dialect: "bac"
                    path:
                      - "e5f6a7b8-c9d0-1234-efab-345678901234"
                      - "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      - "98765432-abcd-ef01-2345-6789abcdef01"
                ba_ngoai_bac:
                  summary: Maternal grandmother (Bà ngoại - Chi ngoại, phương ngữ Bắc)
                  value:
                    term: "Bà ngoại"
                    line: "Chi ngoại"
                    generation_distance: 2
                    distance_label: "Cách 2 đời"
                    is_blood: true
